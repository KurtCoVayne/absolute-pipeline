# The report site (contracts.md section 8, PL-D6): nginx serves the directory
# `abt-report build --out` wrote, on the machine's port 8080, reached through
# an SSH tunnel (`ssh -L 8080:127.0.0.1:8080`). Static files only; nothing
# here runs code.
server {
    listen 8080;
    server_name _;
    root /site;
    index index.html;
    charset utf-8;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    location / {
        try_files $uri $uri/ =404;
    }
    location = /style.css {
        expires 1h;
    }
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;
}
